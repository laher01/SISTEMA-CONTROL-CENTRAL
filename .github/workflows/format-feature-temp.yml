name: Format feature branch (temporary)
on:
  push:
    branches:
      - feature/gerentes-responsables-multiples-20261009
    paths:
      - .github/workflows/format-feature-temp.yml
permissions:
  contents: write
jobs:
  format:
    if: github.ref == 'refs/heads/feature/gerentes-responsables-multiples-20261009'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Format backend
        working-directory: backend
        run: |
          uv sync --locked
          uv run ruff format .
      - name: Commit formatted files to feature branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend
          if ! git diff --cached --quiet; then
            git commit -m 'style: format new gerencias changes with Ruff'
            git push origin HEAD:feature/gerentes-responsables-multiples-20261009
          fi
