name: verify-platform-superadmin-vps-staging
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: factcentral-staging-platform-verify
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 15
    steps:
      - name: Verificar destino y secretos
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
        run: |
          test "$VPS_HOST" = "132.145.233.172"
          test "$VPS_USER" = "ubuntu"
          for name in VPS_DEPLOY_PATH VPS_SSH_PRIVATE_KEY VPS_SSH_KNOWN_HOSTS; do
            test -n "${!name:-}" || { echo "::error::Falta $name"; exit 1; }
          done
      - name: Configurar acceso SSH existente
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$VPS_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
      - name: Auditar identidades, migraciones y conteos sin secretos
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
        run: |
          ssh -o BatchMode=yes -o ConnectTimeout=15 "$VPS_USER@$VPS_HOST" \
            "cd -- '$VPS_DEPLOY_PATH' && bash -s" <<'REMOTE'
          set -Eeuo pipefail
          test -f deploy/.env.production
          compose=(docker compose --env-file deploy/.env.production -f deploy/docker-compose.production.yml)
          echo "=== ESTADO DE CONTENEDORES ==="
          "${compose[@]}" ps </dev/null
          echo "=== INVENTARIO SQL SIN CONTRASEÑAS NI TOKENS ==="
          echo "=== VERIFICAR PLATFORM Y CUENTA GLOBAL ==="
          "${compose[@]}" exec -T backend uv run python -c 'from sqlalchemy import select; from app.core.db import get_sessionmaker; from app.models import Tenant,Miembro,CuentaAcceso; s=get_sessionmaker()(); t=s.scalar(select(Tenant).where(Tenant.codigo=="PLATFORM")); print("PLATFORM_EXISTE:",bool(t)); m=s.scalar(select(Miembro).where(Miembro.tenant_id==t.id,Miembro.codigo=="SUPADMIN01")) if t else None; print("SUPADMIN01_EXISTE:",bool(m)); print("SUPADMIN01_ROL:",m.rol if m else "NINGUNO"); print("SUPADMIN01_ACTIVO:",m.activo if m else False); cuenta=s.scalar(select(CuentaAcceso).where(CuentaAcceso.tenant_id==t.id,CuentaAcceso.miembro_id==m.id)) if m else None; print("CUENTA_ACCESO_EXISTE:",bool(cuenta)); print("CUENTA_ACCESO_ACTIVA:",cuenta.activo if cuenta else False); s.close()' </dev/null
          echo "ARCHIVO_PRIVADO_PRESENTE: $(test -s deploy/private/platform-bootstrap-credentials.txt && echo SI || echo NO)"
          echo "VERIFICACION_IDENTIDAD_SOLO_LECTURA"
          REMOTE
