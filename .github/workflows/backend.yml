name: backend

on:
  workflow_call:
  push:
    branches: [main]
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: fact
          POSTGRES_PASSWORD: fact
          POSTGRES_DB: fact_central
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fact"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      FC_TEST_DATABASE_URL: postgresql+psycopg://fact:fact@localhost:5432/fact_central
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy app
      - run: uv run pytest
      - name: Auditar dependencias runtime
        run: |
          uv export --locked --no-dev --format requirements-txt --output-file runtime-requirements.txt
          uv run --locked --with pip-audit pip-audit --require-hashes --no-deps -r runtime-requirements.txt
      - name: Validar migraciones en PostgreSQL aislado
        run: |
          uv run python -c "import psycopg; c=psycopg.connect('postgresql://fact:fact@localhost:5432/postgres', autocommit=True); c.execute('CREATE DATABASE fact_central_migrations'); c.close()"
          uv run alembic upgrade head
          uv run alembic downgrade 0015
          uv run alembic upgrade head
        env:
          FC_DATABASE_URL: postgresql+psycopg://fact:fact@localhost:5432/fact_central_migrations
