name: Android APK (pruebas)
on:
  pull_request:
    paths: ['android/**', '.github/workflows/android-apk.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-35' 'build-tools;34.0.0'
      - run: gradle -p android --no-daemon testDebugUnitTest lintDebug assembleDebug
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk FACT-CENTRAL-pruebas.apk
      - uses: actions/upload-artifact@v4
        with:
          name: FACT-CENTRAL-pruebas
          path: FACT-CENTRAL-pruebas.apk
          retention-days: 14
