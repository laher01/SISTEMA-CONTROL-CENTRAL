name: backup-documents-vps-staging
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: factcentral-staging-documents-backup
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 15
    steps:
      - name: Verificar destino y secretos
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
        run: |
          test "$VPS_HOST" = "132.145.233.172"
          test "$VPS_USER" = "ubuntu"
          for name in VPS_DEPLOY_PATH VPS_SSH_PRIVATE_KEY VPS_SSH_KNOWN_HOSTS; do
            test -n "${!name:-}" || { echo "::error::Falta $name"; exit 1; }
          done
      - name: Configurar acceso SSH existente
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$VPS_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
      - name: Respaldar y verificar volumen de documentos
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
        run: |
          ssh -o BatchMode=yes -o ConnectTimeout=15 "$VPS_USER@$VPS_HOST" \
            "cd -- '$VPS_DEPLOY_PATH' && bash -s" <<'REMOTE'
          set -Eeuo pipefail
          test -f deploy/.env.production
          volume="fact_central_staging_documentos"
          docker volume inspect "$volume" >/dev/null
          dir="deploy/backups/documentos"
          mkdir -p "$dir"
          chmod 700 "$dir"
          stamp="$(date -u +%Y%m%dT%H%M%SZ)"
          file="$dir/documentos_${stamp}.tar.gz"
          tmp="$file.partial"
          trap 'rm -f "$tmp"' EXIT
          echo "Volumen de documentos encontrado"
          docker run --rm --network none --mount "type=volume,src=$volume,dst=/origen,readonly" alpine:3.21 \
            sh -c 'cd /origen && tar -czf - .' </dev/null > "$tmp"
          test -s "$tmp"
          tar -tzf "$tmp" >/dev/null
          mv "$tmp" "$file"
          chmod 600 "$file"
          sha256sum "$file" > "$file.sha256"
          sha256sum -c "$file.sha256"
          count="$(tar -tzf "$file" | wc -l)"
          bytes="$(stat -c %s "$file")"
          echo "ARCHIVO_DOCUMENTOS_VERIFICADO: $file"
          echo "ENTRADAS_TAR: $count"
          echo "TAMANIO_BYTES: $bytes"
          echo "NOTA: respaldo legible; extracción de prueba y consistencia entre DB/documentos aún pendientes"
          REMOTE
