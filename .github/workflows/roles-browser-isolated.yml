name: roles-browser-isolated

on:
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/roles-browser-isolated.yml"

permissions:
  contents: read

jobs:
  browser:
    # Playwright 1.58.2 does not yet ship browser dependencies for Ubuntu 26.04.
    # Keep browser CI on the supported 24.04 image until upstream adds 26.04 support.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Instalar Playwright únicamente en runner temporal
        run: npm install --no-save --package-lock=false @playwright/test@1.58.2
      - run: npx playwright install --with-deps chromium
      - name: Navegación aislada con API simulada (sin VPS ni secretos)
        run: npx playwright test e2e/roles.spec.ts --browser chromium --reporter=line
        env:
          CI: "true"
