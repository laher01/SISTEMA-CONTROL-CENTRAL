name: ssh-connection-test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-ssh:
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 5
    steps:
      - name: Verificar secretos sin revelar su contenido
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          for name in VPS_HOST VPS_USER VPS_DEPLOY_PATH VPS_SSH_PRIVATE_KEY VPS_SSH_KNOWN_HOSTS; do
            test -n "${!name:-}" || { echo "::error::Falta el secreto $name"; exit 1; }
          done
          test "$VPS_HOST" = "132.145.233.172" || { echo "::error::Host no autorizado para esta prueba"; exit 1; }
          test "$VPS_USER" = "ubuntu" || { echo "::error::Usuario no autorizado"; exit 1; }
          test "$VPS_DEPLOY_PATH" = "/home/ubuntu/fact-central" || { echo "::error::Ruta inesperada"; exit 1; }

      - name: Configurar SSH seguro
        shell: bash
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$VPS_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$HOME/.ssh/id_ed25519" > /dev/null

      - name: Verificar conexión y servicios (solo lectura)
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 \
            -o ServerAliveInterval=5 -o ServerAliveCountMax=2 \
            "$VPS_USER@$VPS_HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          test "$(whoami)" = ubuntu
          cd /home/ubuntu/fact-central
          test -f deploy/docker-compose.production.yml
          echo "SSH autenticado; proyecto localizado"
          echo "Servidor: $(hostname)"
          echo "Commit: $(git rev-parse --short HEAD)"
          docker compose version
          curl --fail --silent --show-error --max-time 10 http://127.0.0.1:18080/health >/dev/null
          echo "Backend saludable"
          REMOTE
