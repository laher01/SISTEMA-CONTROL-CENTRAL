name: test-deploy-scripts

on:
  pull_request:
    paths:
      - 'deploy/deploy.sh'
      - 'deploy/deploy-legacy-pr140.sh'
      - 'deploy/preflight-secretaria.sh'
      - '.github/workflows/deploy-staging.yml'
      - '.github/workflows/test-deploy-scripts.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bash-and-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check without executing deployment
        run: |
          bash -n deploy/deploy.sh
          bash -n deploy/deploy-legacy-pr140.sh
          bash -n deploy/preflight-secretaria.sh
      - name: Verify non-destructive deployment invariants
        run: |
          python3 - <<'PY'
          from pathlib import Path
          workflow = Path('.github/workflows/deploy-staging.yml').read_text()
          deploy = Path('deploy/deploy-legacy-pr140.sh').read_text()
          main_deploy = Path('deploy/deploy.sh').read_text()
          preflight = Path('deploy/preflight-secretaria.sh').read_text()
          assert 'branches: [main]' in workflow
          assert 'actions/checkout@v4' in workflow
          assert '132.145.233.172' in workflow
          assert 'cancel-in-progress: false' in workflow
          assert 'DESPLIEGUE_VALIDADO' in deploy
          assert 'EXPECTED_COMMIT' in deploy
          assert 'exec -T db pg_restore --list < "$backup"' in deploy
          assert '</dev/null > "$backup"' in deploy
          assert 'build --pull </dev/null' in deploy
          assert 'up -d --remove-orphans </dev/null' in deploy
          assert 'ps --status running db </dev/null' in deploy
          assert 'git status --porcelain --untracked-files=all' in deploy
          assert 'git status --porcelain --untracked-files=all' in preflight
          assert 'docker compose' in preflight
          assert 'command -v "$herramienta"' in preflight
          assert 'pg_restore --version' in preflight
          assert 'flock' in preflight
          assert 'git reset --hard' not in deploy
          assert 'exec -T db pg_restore --list < "$backup"' in main_deploy
          assert 'exec -T db' in main_deploy
          assert '</dev/null > "$backup"' in main_deploy
          assert 'build --pull </dev/null' in main_deploy
          assert 'up -d --remove-orphans </dev/null' in main_deploy
          assert 'git merge --ff-only "$current_commit"' in main_deploy
          assert 'current_commit="$(git rev-parse origin/main)"' in main_deploy
          assert main_deploy.index('Commit remoto inesperado') < main_deploy.index('git checkout main')
          assert 'git reset --hard' not in main_deploy
          assert "if: github.event_name == 'push' && github.ref_name == 'main'" in workflow
          assert "if: github.event_name == 'workflow_dispatch'" in workflow
          assert 'needs: [verify-backend, verify-frontend]' in workflow
          assert 'environment: staging' in workflow
          assert 'Comprobación previa de VPS (solo lectura)' in workflow
          assert 'Desplegar PR140 desde rama aislada' not in workflow
          assert 'branches: [deploy/legacy-pr140-chat-trigger-20261011]' not in workflow
          assert 'factcentral-update.timer' in deploy
          assert 'flock -n 9' in deploy
          assert 'curl -fsS --max-time 5 http://127.0.0.1:18080/health' in deploy
          print('Sintaxis y salvaguardas básicas verificadas')
          PY
