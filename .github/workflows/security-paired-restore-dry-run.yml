name: security-paired-restore-dry-run
on:
  workflow_dispatch:
    inputs:
      confirm_offline:
        description: "Type OFFLINE-ONLY: no SSH, no VPS, no restore"
        required: true
        type: string
  pull_request:
    paths:
      - "deploy/recovery_pair_audit.py"
      - "deploy/recovery_staging_preflight.py"
      - "deploy/test_recovery_staging_preflight.py"
      - ".github/workflows/security-staging-recovery-gated.yml"
      - "deploy/test_recovery_pair_audit.py"
      - ".github/workflows/security-paired-restore-dry-run.yml"
permissions:
  contents: read
jobs:
  local-only:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require explicit offline confirmation for manual execution
        env:
          CONFIRM: ${{ inputs.confirm_offline }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            test "$CONFIRM" = "OFFLINE-ONLY"
          fi
      - uses: actions/checkout@v4
      - name: Verify local auditor syntax
        run: python3 -m py_compile deploy/recovery_pair_audit.py deploy/recovery_staging_preflight.py
      - name: Run synthetic safe archive tests without network or VPS
        run: |
          python3 -m pip install pytest
          python3 -m pytest -q deploy/test_recovery_pair_audit.py deploy/test_recovery_staging_preflight.py
      - name: Explicit safety scope
        run: |
          echo "OFFLINE_SYNTHETIC_TESTS_ONLY"
          echo "NOT_A_BACKUP_OR_RESTORE_OF_STAGING"
          echo "REQUIRES_OPERATOR_STAGING_DRILL_AND_RBAC_REVIEW"
