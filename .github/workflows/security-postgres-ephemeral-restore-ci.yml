name: security-postgres-ephemeral-restore-ci
on:
  pull_request:
    paths:
      - ".github/workflows/security-postgres-ephemeral-restore-ci.yml"
      - "deploy/recovery_pair_audit.py"
      - "deploy/test_recovery_pair_audit.py"
      - "backend/alembic/**"
permissions:
  contents: read
jobs:
  ephemeral-restore:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: fact
          POSTGRES_PASSWORD: fact
          POSTGRES_DB: fact_central
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fact"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: fact
      PGPASSWORD: fact
      FC_DATABASE_URL: postgresql+psycopg://fact:fact@localhost:5432/fact_central
      FC_TEST_DATABASE_URL: postgresql+psycopg://fact:fact@localhost:5432/fact_central
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install PostgreSQL client and Python dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
          cd backend && uv sync --locked
      - name: Restore a synthetic PostgreSQL snapshot and test 0039 rollback
        shell: bash
        run: |
          set -Eeuo pipefail
          tmp="$(mktemp -d)"
          cleanup() {
            dropdb --if-exists fact_restore_test || true
            rm -rf -- "$tmp"
          }
          trap cleanup EXIT
          cd backend
          uv run alembic upgrade 0038
          psql -X -v ON_ERROR_STOP=1 -d fact_central -c "create table synthetic_restore_marker(id integer primary key, tenant text not null)"
          psql -X -v ON_ERROR_STOP=1 -d fact_central -c "insert into synthetic_restore_marker values (1, 'tenant-alpha'), (2, 'tenant-beta')"
          pg_dump -Fc -d fact_central -f "$tmp/synthetic.dump"
          sha256sum "$tmp/synthetic.dump" > "$tmp/synthetic.dump.sha256"
          (cd "$tmp" && sha256sum -c synthetic.dump.sha256)
          createdb fact_restore_test
          pg_restore --no-owner --no-acl --exit-on-error -d fact_restore_test "$tmp/synthetic.dump"
          test "$(psql -X -At -v ON_ERROR_STOP=1 -d fact_restore_test -c "select count(*) from synthetic_restore_marker")" = "2"
          test "$(psql -X -At -v ON_ERROR_STOP=1 -d fact_restore_test -c "select version_num from alembic_version")" = "0038"
          FC_DATABASE_URL=postgresql+psycopg://fact:fact@localhost:5432/fact_restore_test uv run alembic upgrade 0039
          test "$(psql -X -At -d fact_restore_test -c "select version_num from alembic_version")" = "0039"
          FC_DATABASE_URL=postgresql+psycopg://fact:fact@localhost:5432/fact_restore_test uv run alembic downgrade -1
          test "$(psql -X -At -d fact_restore_test -c "select version_num from alembic_version")" = "0038"
          FC_DATABASE_URL=postgresql+psycopg://fact:fact@localhost:5432/fact_restore_test uv run alembic upgrade 0039
          test "$(psql -X -At -d fact_restore_test -c "select count(*) from synthetic_restore_marker")" = "2"
          echo "EPHEMERAL_POSTGRES_RESTORE_AND_0039_ROUNDTRIP_OK"
      - name: Validate synthetic file audit tests
        run: |
          python3 -m pip install pytest
          python3 -m pytest -q deploy/test_recovery_pair_audit.py deploy/test_recovery_staging_preflight.py deploy/test_recovery_drill_offline.py
