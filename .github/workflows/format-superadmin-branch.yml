name: format-superadmin-branch
on:
  push:
    branches:
      - fix/separate-superadmin-admin-20261009
permissions:
  contents: write
jobs:
  format:
    if: "!contains(github.event.head_commit.message, '[format-bot]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/separate-superadmin-admin-20261009
          persist-credentials: true
      - uses: astral-sh/setup-uv@v6
      - name: Format backend files with pinned Ruff
        working-directory: backend
        run: |
          uv sync --locked
          uv run ruff format .
          uv run ruff check .
      - name: Commit formatting only when needed
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add backend
            git commit -m "Format backend with pinned Ruff [format-bot]"
            git push origin HEAD:fix/separate-superadmin-admin-20261009
          fi
