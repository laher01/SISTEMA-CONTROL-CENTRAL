name: audit-identities-vps-staging
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: factcentral-staging-identities
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 15
    steps:
      - name: Verificar destino y secretos
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
        run: |
          test "$VPS_HOST" = "132.145.233.172"
          test "$VPS_USER" = "ubuntu"
          for name in VPS_DEPLOY_PATH VPS_SSH_PRIVATE_KEY VPS_SSH_KNOWN_HOSTS; do
            test -n "${!name:-}" || { echo "::error::Falta $name"; exit 1; }
          done
      - name: Configurar acceso SSH existente
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$VPS_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
      - name: Auditar identidades, migraciones y conteos sin secretos
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
        run: |
          ssh -o BatchMode=yes -o ConnectTimeout=15 "$VPS_USER@$VPS_HOST" \
            "cd -- '$VPS_DEPLOY_PATH' && bash -s" <<'REMOTE'
          set -Eeuo pipefail
          test -f deploy/.env.production
          compose=(docker compose --env-file deploy/.env.production -f deploy/docker-compose.production.yml)
          echo "=== ESTADO DE CONTENEDORES ==="
          "${compose[@]}" ps </dev/null
          echo "=== INVENTARIO SQL SIN CONTRASEÑAS NI TOKENS ==="
          "${compose[@]}" exec -T db sh -c 'psql -X -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB"' <<'SQL'
          SELECT version_num AS alembic_actual FROM alembic_version;
          SELECT codigo, nombre, estado, id::text AS tenant_id FROM tenants ORDER BY codigo NULLS LAST;
          SELECT t.codigo AS tenant, m.codigo AS miembro, m.rol, m.activo,
                 COUNT(c.id) AS cuentas_activas
          FROM miembros m JOIN tenants t ON t.id=m.tenant_id
          LEFT JOIN cuentas_acceso c ON c.miembro_id=m.id AND c.deleted_at IS NULL AND c.activo
          WHERE m.codigo IN ('ADMIN01','SUPADMIN01') AND m.deleted_at IS NULL
          GROUP BY t.codigo,m.codigo,m.rol,m.activo ORDER BY t.codigo,m.codigo;
          SELECT 'tenants' AS entidad, count(*) AS total FROM tenants
          UNION ALL SELECT 'miembros', count(*) FROM miembros
          UNION ALL SELECT 'cuentas_acceso', count(*) FROM cuentas_acceso
          UNION ALL SELECT 'gestores', count(*) FROM gestores
          UNION ALL SELECT 'expedientes', count(*) FROM expedientes
          UNION ALL SELECT 'chat_mensajes', count(*) FROM chat_mensajes;
          SQL
          echo "AUDITORIA_SOLO_LECTURA_COMPLETADA"
          REMOTE
