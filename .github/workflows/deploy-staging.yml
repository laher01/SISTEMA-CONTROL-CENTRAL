name: deploy-staging

on:
  workflow_dispatch:
  push:
    branches: [deploy/legacy-pr140-chat-trigger-20261011]

permissions:
  contents: read

concurrency:
  group: fact-central-staging
  cancel-in-progress: false

jobs:
  verify-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: fact
          POSTGRES_PASSWORD: fact
          POSTGRES_DB: fact_central
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fact"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      FC_TEST_DATABASE_URL: postgresql+psycopg://fact:fact@localhost:5432/fact_central
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy app
      - run: uv run pytest

  verify-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  deploy:
    needs: [verify-backend, verify-frontend]
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 20
    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Validar secretos de despliegue
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
        run: |
          if [ "$VPS_HOST" != "132.145.233.172" ] || [ "$VPS_USER" != "ubuntu" ]; then
            echo "::error::Despliegue bloqueado: únicamente VPS antigua ubuntu@132.145.233.172"
            exit 1
          fi
          for name in VPS_HOST VPS_USER VPS_DEPLOY_PATH VPS_SSH_PRIVATE_KEY VPS_SSH_KNOWN_HOSTS; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Falta el secreto $name en el environment staging"
              exit 1
            fi
          done

      - name: Configurar SSH
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Comprobación previa de VPS (solo lectura)
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
        run: |
          ssh -o BatchMode=yes -o ConnectTimeout=15 "$VPS_USER@$VPS_HOST" \
            "cd -- '$VPS_DEPLOY_PATH' && bash -s" < deploy/preflight-secretaria.sh

      - name: Desplegar rama documental en VPS antigua (manual, sin main)
        if: github.event_name == 'workflow_dispatch'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          test "${{ github.ref_name }}" = "integration/document-capture-main-20261011" || { echo "::error::Rama no autorizada"; exit 1; }
          ssh -o BatchMode=yes -o ConnectTimeout=15 "$VPS_USER@$VPS_HOST" \
            "cd -- '$VPS_DEPLOY_PATH' && EXPECTED_COMMIT='$EXPECTED_COMMIT' DEPLOY_BRANCH='integration/document-capture-main-20261011' bash -s" < deploy/deploy-legacy-pr140.sh

      - name: Verificar selección exacta de despliegue aislado
        if: github.event_name == 'push' && github.ref_name == 'deploy/legacy-pr140-chat-trigger-20261011'
        run: |
          test "${{ github.ref_name }}" = "deploy/legacy-pr140-chat-trigger-20261011"
          test "${{ github.event_name }}" = "push"
          echo "Despliegue aislado autorizado, VPS antigua 132.145.233.172, commit documental fijo 2e68eb0834465839fadc7bff6a843c8eef2a5b4d"

      - name: Desplegar PR140 desde rama aislada, VPS antigua solamente
        if: github.event_name == 'push' && github.ref_name == 'deploy/legacy-pr140-chat-trigger-20261011'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
          EXPECTED_COMMIT: 2e68eb0834465839fadc7bff6a843c8eef2a5b4d
        run: |
          ssh -o BatchMode=yes -o ConnectTimeout=15 "$VPS_USER@$VPS_HOST" \
            "cd -- '$VPS_DEPLOY_PATH' && EXPECTED_COMMIT='$EXPECTED_COMMIT' DEPLOY_BRANCH='integration/document-capture-main-20261011' bash -s" < deploy/deploy-legacy-pr140.sh

      - name: Certificar estado instalado (solo lectura, no desplegar)
        if: github.event_name == 'push' && github.ref_name == 'deploy/legacy-pr140-chat-trigger-20261011'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
        run: |
          ssh -o BatchMode=yes -o ConnectTimeout=15 "$VPS_USER@$VPS_HOST" \
            "cd -- '$VPS_DEPLOY_PATH' && bash -s" <<'VERIFY'
          set -Eeuo pipefail
          expected="2e68eb0834465839fadc7bff6a843c8eef2a5b4d"
          actual="$(git rev-parse HEAD)"
          echo "COMMIT_INSTALADO=$actual"
          echo "COMMIT_ESPERADO=$expected"
          compose=(docker compose --env-file deploy/.env.production -f deploy/docker-compose.production.yml)
          echo "CONTENEDORES:"
          "${compose[@]}" ps
          echo "BACKUPS_RECIENTES:"
          find deploy/backups -maxdepth 1 -type f -name '*pr140.dump' -printf '%TY-%Tm-%TdT%TH:%TM %s %p\n' 2>/dev/null | sort | tail -n 5 || true
          if [[ "$actual" != "$expected" ]]; then
            echo "::error::El commit documental todavía NO está instalado."
            exit 1
          fi
          curl --fail --silent --show-error --max-time 10 http://127.0.0.1:18080/health > /dev/null
          echo "HEALTHCHECK_POSTERIOR=OK"
          latest="$(find deploy/backups -maxdepth 1 -type f -name '*pr140.dump' -printf '%T@ %p\n' 2>/dev/null | sort -nr | head -n 1 | cut -d' ' -f2-)"
          [[ -n "$latest" && -s "$latest" ]] || { echo "::error::No existe respaldo PR140 verificable"; exit 1; }
          pg_restore --list "$latest" >/dev/null
          echo "BACKUP_PR140_VALIDADO=$latest"
          echo "INSTALACION_CERTIFICADA=$actual"
          VERIFY

      - name: Desplegar main en VPS (flujo anterior)
        if: github.event_name == 'push' && github.ref_name == 'main'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          ssh -o BatchMode=yes -o ConnectTimeout=15 "$VPS_USER@$VPS_HOST" \
            "cd -- '$VPS_DEPLOY_PATH' && EXPECTED_COMMIT='$EXPECTED_COMMIT' bash deploy/deploy.sh"
