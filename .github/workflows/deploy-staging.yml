name: deploy-staging

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - '.github/workflows/deploy-staging.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fact-central-staging
  cancel-in-progress: false

jobs:
  verify-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: fact
          POSTGRES_PASSWORD: fact
          POSTGRES_DB: fact_central
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fact"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      FC_TEST_DATABASE_URL: postgresql+psycopg://fact:fact@localhost:5432/fact_central
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy app
      - run: uv run pytest

  verify-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  deploy:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: [verify-backend, verify-frontend]
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Validar secretos de despliegue
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
        run: |
          if [ "$VPS_HOST" != "132.145.233.172" ] || [ "$VPS_USER" != "ubuntu" ]; then
            echo "::error::Despliegue bloqueado: únicamente VPS antigua ubuntu@132.145.233.172"
            exit 1
          fi
          for name in VPS_HOST VPS_USER VPS_DEPLOY_PATH VPS_SSH_PRIVATE_KEY VPS_SSH_KNOWN_HOSTS; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Falta el secreto $name en el environment staging"
              exit 1
            fi
          done

      - name: Configurar SSH
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Comprobación previa de VPS (solo lectura)
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          ssh -o BatchMode=yes -o ConnectTimeout=15 "$VPS_USER@$VPS_HOST" \
            "cd -- '$VPS_DEPLOY_PATH' && EXPECTED_COMMIT='$EXPECTED_COMMIT' bash -s" < deploy/preflight-secretaria.sh

      - name: Verificar evento y commit de main
        run: |
          case "${{ github.event_name }}" in
            push|workflow_dispatch) ;;
            *) echo "::error::Evento no autorizado"; exit 1 ;;
          esac
          test "${{ github.ref_name }}" = "main" || {
            echo "::error::Solo se permite desplegar un commit integrado en main"
            exit 1
          }

      - name: Verificar backup y restauración aislada antes del despliegue
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
        run: |
          test "$VPS_HOST" = "132.145.233.172" && test "$VPS_USER" = "ubuntu" || exit 1
          # Usar el script del commit comprobado por Actions, no uno ausente u obsoleto en la VPS.
          # El archivo temporal vive en deploy/ para conservar la resolucion de rutas del script.
          ssh -o BatchMode=yes -o ConnectTimeout=15 "$VPS_USER@$VPS_HOST" \
            "set -eu; cd -- '$VPS_DEPLOY_PATH'; script=\$(mktemp deploy/.preflight-restore-XXXXXX.sh); trap 'rm -f \"\$script\"' EXIT; cat > \"\$script\"; EXPECTED_HOST='132.145.233.172' bash \"\$script\"" \
            < deploy/preflight-backup-restore-items.sh

      - name: Desplegar commit validado en VPS autorizada
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          ssh -o BatchMode=yes -o ConnectTimeout=15 "$VPS_USER@$VPS_HOST" \
            "set -eu; script=\$(mktemp); trap 'rm -f \"\$script\"' EXIT; cat > \"\$script\"; cd -- '$VPS_DEPLOY_PATH'; EXPECTED_COMMIT='$EXPECTED_COMMIT' bash \"\$script\"; test \"\$(git rev-parse HEAD)\" = '$EXPECTED_COMMIT'; echo 'Commit VPS verificado: $EXPECTED_COMMIT'" \
            < deploy/bootstrap-main.sh
