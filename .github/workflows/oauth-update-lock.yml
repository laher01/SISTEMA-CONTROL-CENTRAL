name: Actualizar lock OAuth temporal
on:
  push:
    branches:
      - feature/f-google-oauth-inicio-seguro
    paths:
      - backend/pyproject.toml
      - .github/workflows/oauth-update-lock.yml
permissions:
  contents: write
jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/f-google-oauth-inicio-seguro
      - uses: astral-sh/setup-uv@v6
      - name: Actualizar uv.lock
        run: cd backend && uv lock
      - name: Publicar lock en la rama
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/uv.lock
          if ! git diff --cached --quiet; then
            git commit -m "build(oauth): lock cryptography dependencies"
            git push origin HEAD:feature/f-google-oauth-inicio-seguro
          fi
