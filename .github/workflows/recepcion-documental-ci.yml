name: recepcion-documental-ci
on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/recepcion-documental-ci.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: fact_central
          POSTGRES_USER: fact
          POSTGRES_PASSWORD: fact
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fact -d fact_central"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      FC_TEST_DATABASE_URL: postgresql+psycopg://fact:fact@localhost:5432/fact_central
      FC_DATABASE_URL: postgresql+psycopg://fact:fact@localhost:5432/fact_central
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy app
      - run: uv run pytest
      - name: Check Alembic upgrade on disposable DB
        run: uv run alembic upgrade head
      - name: Inspect migration heads
        run: uv run alembic heads

  ssh-readonly-pr156:
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 156 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Confirmar secretos y destino conocido
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          for name in VPS_HOST VPS_USER VPS_DEPLOY_PATH VPS_SSH_PRIVATE_KEY VPS_SSH_KNOWN_HOSTS; do
            test -n "${!name:-}" || { echo "::error::Secret missing: $name"; exit 1; }
          done
          test "$VPS_HOST" = '132.145.233.172' || { echo "::error::Unexpected VPS host"; exit 1; }
          test "$VPS_USER" = 'ubuntu' || { echo "::error::Unexpected VPS user"; exit 1; }
          test "$VPS_DEPLOY_PATH" = '/home/ubuntu/fact-central' || { echo "::error::Unexpected deploy path"; exit 1; }
      - name: Conectar mediante SSH sin modificar servicios
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$VPS_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$HOME/.ssh/id_ed25519" >/dev/null
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 \
            "$VPS_USER@$VPS_HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          test "$(whoami)" = ubuntu
          cd /home/ubuntu/fact-central
          test -f deploy/docker-compose.production.yml
          echo "SSH connection successful"
          echo "Server: $(hostname)"
          echo "Git commit: $(git rev-parse --short HEAD)"
          docker compose version
          curl --fail --silent --show-error --max-time 10 http://127.0.0.1:18080/health >/dev/null
          echo "Backend healthy"
          REMOTE
