name: recepcion-documental-ci
on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/recepcion-documental-ci.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: fact_central
          POSTGRES_USER: fact
          POSTGRES_PASSWORD: fact
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fact -d fact_central"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      FC_TEST_DATABASE_URL: postgresql+psycopg://fact:fact@localhost:5432/fact_central
      FC_DATABASE_URL: postgresql+psycopg://fact:fact@localhost:5432/fact_central
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy app
      - run: uv run pytest
      - name: Check Alembic upgrade on disposable DB
        run: uv run alembic upgrade head
      - name: Inspect migration heads
        run: uv run alembic heads
