name: Format Pagos hotfix (temporary)
on:
  push:
    branches:
      - hotfix/pagos-historicos-grteglobal-20261010
    paths:
      - .github/workflows/format-pagos-temp.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/pagos-historicos-grteglobal-20261010
      - uses: astral-sh/setup-uv@v6
      - name: Apply pinned Ruff
        working-directory: backend
        run: |
          uv sync --locked
          uv run ruff check --fix .
          uv run ruff format .
      - name: Commit formatted backend
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend
          if ! git diff --cached --quiet; then
            git commit -m 'style: format pagos históricos hotfix'
            git push origin HEAD:hotfix/pagos-historicos-grteglobal-20261010
          fi
