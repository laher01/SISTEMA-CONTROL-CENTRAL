name: items-migration-ci

on:
  pull_request:
    paths:
      - "backend/alembic/**"
      - "backend/app/item_models.py"
      - ".github/workflows/items-migration-ci.yml"

jobs:
  migration:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: fact
          POSTGRES_PASSWORD: fact
          POSTGRES_DB: fact_central
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fact"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      FC_DATABASE_URL: postgresql+psycopg://fact:fact@localhost:5432/fact_central
      FC_TEST_DATABASE_URL: postgresql+psycopg://fact:fact@localhost:5432/fact_central
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run alembic heads
      - run: uv run alembic upgrade head
      - run: uv run alembic downgrade -1
      - run: uv run alembic upgrade head
