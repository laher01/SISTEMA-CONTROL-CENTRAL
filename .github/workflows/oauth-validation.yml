name: OAuth preflight validation

on:
  push:
    branches:
      - feature/oauth-google-microsoft-integracion-20261011
  pull_request:
    paths:
      - 'scripts/oauth_preflight.py'
      - 'backend/tests/test_oauth_preflight.py'
      - 'backend/tests/test_microsoft_oauth_helpers.py'
      - 'backend/app/services/microsoft_oauth_correo.py'
      - 'frontend/src/paginas/Configuracion.tsx'
      - 'deploy/docker-compose.production.yml'
      - '.github/workflows/oauth-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  oauth-preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install official backend dependencies
        working-directory: backend
        run: uv sync --locked
      - name: Run OAuth configuration validation tests
        working-directory: backend
        run: uv run pytest -q tests/test_oauth_preflight.py tests/test_microsoft_oauth_helpers.py

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Typecheck and build frontend
        working-directory: frontend
        run: npm run build
