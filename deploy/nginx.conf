# Portal comercial separado del frontend de la aplicación.
server {
    listen 80;
    server_name factcentral.online www.factcentral.online;
    client_max_body_size 25m;
    root /usr/share/nginx/comercial;
    index index.html;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 180s;
    }

    location = /health {
        proxy_pass http://backend:8000/health;
    }

    # Acceso operativo desde el portal: React SPA sin alterar la portada comercial.
    location = /ingresar {
        root /usr/share/nginx/html;
        try_files /index.html =404;
        add_header Cache-Control "no-store, max-age=0" always;
    }

    # Recursos estáticos del frontend operativo usados por /ingresar.
    location ^~ /assets/ {
        root /usr/share/nginx/html;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, max-age=0" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        add_header X-Frame-Options DENY always;
    }
}

