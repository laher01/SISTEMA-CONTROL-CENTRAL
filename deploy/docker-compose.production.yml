name: fact-central-staging

services:
  db:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - fact_central_pgdata:/var/lib/postgresql/data
    networks: [fact_central_internal]

  backend:
    build:
      context: ..
      dockerfile: deploy/backend.Dockerfile
    restart: unless-stopped
    environment:
      FC_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      FC_STORAGE_DIR: /data/documentos
      FC_TENANT_DEFAULT: ${FC_TENANT_DEFAULT}
      FC_TENANT_DOMAIN: ${FC_TENANT_DOMAIN:-factcentral.online}
      FC_TENANT_RUC: ${FC_TENANT_RUC:-}
      FC_ZONA_HORARIA: America/Lima
      FC_DIA_LIMITE_EXPEDIENTE: ${FC_DIA_LIMITE_EXPEDIENTE:-7}
      FC_UMBRAL_BANCARIZACION_PEN: ${FC_UMBRAL_BANCARIZACION_PEN:-2000}
      FC_UMBRAL_BANCARIZACION_USD: ${FC_UMBRAL_BANCARIZACION_USD:-500}
      FC_MAX_UPLOAD_MB: ${FC_MAX_UPLOAD_MB:-20}
      FC_MAX_EXTRACTED_CHARS: ${FC_MAX_EXTRACTED_CHARS:-200000}
      FC_MAX_OCR_PDF_PAGES: ${FC_MAX_OCR_PDF_PAGES:-50}
      FC_PROCESAMIENTO_AUTOMATICO: ${FC_PROCESAMIENTO_AUTOMATICO:-true}
      FC_CONFIANZA_MINIMA_CLASIFICACION: ${FC_CONFIANZA_MINIMA_CLASIFICACION:-0.80}
      FC_CONFIANZA_MINIMA_EXPEDIENTE: ${FC_CONFIANZA_MINIMA_EXPEDIENTE:-0.75}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "uv", "run", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
    volumes:
      - fact_central_documentos:/data/documentos
    networks: [fact_central_internal]

  frontend:
    build:
      context: ..
      dockerfile: deploy/frontend.Dockerfile
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${FACT_CENTRAL_LOCAL_PORT:-18080}:80"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [fact_central_internal]

  tunnel:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel run --token ${CLOUDFLARE_TUNNEL_TOKEN:?Falta CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      frontend:
        condition: service_healthy
    networks: [fact_central_internal]

volumes:
  fact_central_pgdata:
    name: fact_central_staging_pgdata
  fact_central_documentos:
    name: fact_central_staging_documentos

networks:
  fact_central_internal:
    name: fact_central_staging_internal
